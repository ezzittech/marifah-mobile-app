# Serves the frontend AND proxies /api to the Node service, on one port (no CORS, no mixed content).
# Install: sudo cp deploy/nginx-app.conf /etc/nginx/conf.d/marifah-app.conf && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 6976;
    server_name _;

    root /opt/marifah-mobile-app/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:6975;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 1m;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
